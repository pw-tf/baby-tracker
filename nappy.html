<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#1B1713">
    <title>Baby Tracker — Nappies</title>
    <script src="js/theme.js"></script>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="app-container">
        <header class="appbar" id="appbar"></header>

        <h1 class="screen-title">Nappies</h1>

        <!-- Log a change -->
        <section class="card cat-nappy">
            <div class="micro-label" style="margin-bottom:12px">Log a change</div>
            <div class="quick-row">
                <button class="quick-btn stacked" onclick="quickLog('wet')"><span id="qb-wet" style="color:var(--c-wet);display:flex"></span>Wet</button>
                <button class="quick-btn stacked" onclick="quickLog('poo')"><span id="qb-poo" style="color:var(--c-dirty);display:flex"></span>Dirty</button>
                <button class="quick-btn stacked filled cat-nappy" onclick="quickLog('both')"><span id="qb-both" style="display:flex"></span>Both</button>
            </div>
            <button class="pill-btn" style="margin-top:12px" onclick="toggleDetails()"><span id="details-icon"></span><span id="details-label">Log with details…</span></button>
        </section>

        <!-- Details form (photo, notes, custom time) -->
        <section class="card" id="details-card" style="display:none">
            <div class="micro-label" style="margin-bottom:12px">Change details</div>
            <div class="form-group">
                <label class="form-label">Type</label>
                <div class="toggle-group">
                    <button class="toggle-btn active" data-type="wet" onclick="setNappyType('wet')">Wet</button>
                    <button class="toggle-btn" data-type="poo" onclick="setNappyType('poo')">Dirty</button>
                    <button class="toggle-btn" data-type="both" onclick="setNappyType('both')">Both</button>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" for="changed-at">Time</label>
                <input type="datetime-local" id="changed-at" class="form-input">
            </div>

            <div class="form-group">
                <label class="form-label">Photo <span class="optional-hint">(optional)</span></label>
                <div class="image-upload-area" id="upload-area">
                    <div id="upload-placeholder">
                        <div class="upload-icon" id="upload-icon"></div>
                        <div class="upload-text">Tap to add photo</div>
                    </div>
                    <div id="upload-preview" style="display:none"></div>
                    <input type="file" id="image-input" accept="image/*" capture="environment" onchange="handleImageSelect(event)">
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" for="notes">Notes</label>
                <textarea id="notes" class="form-textarea" placeholder="Optional notes…" rows="2"></textarea>
            </div>

            <button class="btn btn-primary" id="save-btn" onclick="saveEntry()">Save change</button>
        </section>

        <!-- Today summary -->
        <section class="card">
            <div class="triple">
                <div>
                    <div class="triple-value" id="sum-count">—</div>
                    <div class="triple-label">today</div>
                </div>
                <div>
                    <div class="triple-value" id="sum-split">—</div>
                    <div class="triple-label">wet · dirty</div>
                </div>
                <div>
                    <div class="triple-value" id="sum-since">—</div>
                    <div class="triple-label">since last</div>
                </div>
            </div>
        </section>

        <!-- Changes per day -->
        <section class="card cat-nappy">
            <div class="card-head" style="align-items:baseline;margin-bottom:16px">
                <span class="micro-label">Changes per day</span>
                <span class="card-head-note" id="chart-avg"></span>
            </div>
            <div class="bars" style="height:78px" id="nappy-chart"></div>
        </section>

        <!-- Recent -->
        <section class="card">
            <div class="micro-label" style="margin-bottom:6px">Recent</div>
            <div id="entry-list-container">
                <div class="loading"><div class="spinner"></div></div>
            </div>
        </section>
    </div>

    <!-- Delete Modal -->
    <div id="delete-modal" class="modal-overlay">
        <div class="card modal-card">
            <p style="margin-bottom:16px;font-weight:600">Delete this nappy change?</p>
            <div style="display:flex;gap:8px">
                <button class="btn btn-secondary btn-small" onclick="closeDeleteModal()" style="flex:1">Cancel</button>
                <button class="btn btn-danger btn-small" id="confirm-delete-btn" style="flex:1">Delete</button>
            </div>
        </div>
    </div>

    <!-- Lightbox -->
    <div class="lightbox" id="lightbox" onclick="closeLightbox()">
        <button class="lightbox-close" onclick="closeLightbox()" id="lightbox-close-btn"></button>
        <img id="lightbox-img" src="" alt="Nappy photo">
    </div>

    <!-- Bottom Nav -->
    <nav class="bottom-nav" id="main-nav"></nav>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/icons.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/app-shell.js"></script>
    <script src="js/charts.js"></script>
    <script>
        document.getElementById('qb-wet').innerHTML = icon('droplet');
        document.getElementById('qb-poo').innerHTML = icon('circle-outline');
        document.getElementById('qb-both').innerHTML = icon('droplet');
        document.getElementById('upload-icon').innerHTML = icon('camera', 'icon-xl');
        document.getElementById('lightbox-close-btn').innerHTML = icon('x');
        document.getElementById('details-icon').innerHTML = icon('plus');

        let nappyType = 'wet';
        let selectedImageFile = null;
        let deleteId = null;
        let deleteImagePath = null;
        let recentEntries = [];

        (async () => {
            const session = await requireAuth();
            if (!session) return;
            await initAppShell('nappy.html');
            prefillTime();
            await Promise.all([loadEntries(), loadChart()]);
            setInterval(renderSummary, 30000);
        })();

        function prefillTime() {
            document.getElementById('changed-at').value = toDatetimeLocal(new Date());
        }

        function toggleDetails() {
            const card = document.getElementById('details-card');
            const open = card.style.display !== 'none';
            card.style.display = open ? 'none' : 'block';
            document.getElementById('details-icon').innerHTML = icon(open ? 'plus' : 'minus');
            document.getElementById('details-label').textContent = open ? 'Log with details…' : 'Hide details';
            if (!open) prefillTime();
        }

        function setNappyType(type) {
            nappyType = type;
            document.querySelectorAll('[data-type]').forEach(b => b.classList.toggle('active', b.dataset.type === type));
        }

        // --- One-tap logging ---
        async function quickLog(type) {
            const userId = await getUserId();
            const { error } = await sb.from('nappies').insert({
                user_id: userId,
                nappy_type: type,
                changed_at: new Date().toISOString(),
            });
            if (error) {
                showToast('Error saving: ' + error.message, 'error');
                return;
            }
            const labels = { wet: 'Wet', poo: 'Dirty', both: 'Wet + dirty' };
            showToast(`${labels[type]} nappy logged!`);
            await Promise.all([loadEntries(), loadChart()]);
        }

        // --- Image handling ---
        function handleImageSelect(event) {
            const file = event.target.files[0];
            if (!file) return;
            compressImage(file, 200, (compressedFile) => {
                selectedImageFile = compressedFile;
                showPreview(compressedFile);
            });
        }

        function compressImage(file, maxKB, callback) {
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    let { width, height } = img;

                    const maxDim = 1200;
                    if (width > maxDim || height > maxDim) {
                        const ratio = Math.min(maxDim / width, maxDim / height);
                        width = Math.round(width * ratio);
                        height = Math.round(height * ratio);
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    let quality = 0.8;

                    function tryCompress() {
                        canvas.toBlob((b) => {
                            if (b.size > maxKB * 1024 && quality > 0.1) {
                                quality -= 0.1;
                                tryCompress();
                            } else {
                                const compressed = new File([b], file.name, { type: 'image/jpeg' });
                                callback(compressed);
                            }
                        }, 'image/jpeg', quality);
                    }

                    tryCompress();
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function showPreview(file) {
            const area = document.getElementById('upload-area');
            const placeholder = document.getElementById('upload-placeholder');
            const preview = document.getElementById('upload-preview');

            area.classList.add('has-image');
            placeholder.style.display = 'none';
            preview.style.display = 'block';

            const url = URL.createObjectURL(file);
            preview.innerHTML = `
                <div class="image-preview-wrapper">
                    <img src="${url}" class="image-preview" alt="Preview">
                    <button class="remove-image-btn" onclick="removeImage(event)">${icon('x')}</button>
                </div>`;
        }

        function removeImage(event) {
            event.stopPropagation();
            event.preventDefault();
            selectedImageFile = null;
            const area = document.getElementById('upload-area');
            area.classList.remove('has-image');
            document.getElementById('upload-placeholder').style.display = 'block';
            const preview = document.getElementById('upload-preview');
            preview.style.display = 'none';
            preview.innerHTML = '';
            document.getElementById('image-input').value = '';
        }

        // --- Save (detailed form) ---
        async function saveEntry() {
            const userId = await getUserId();
            const changedAt = document.getElementById('changed-at').value;

            if (!changedAt) {
                showToast('Please set a time.', 'error');
                return;
            }

            const saveBtn = document.getElementById('save-btn');
            saveBtn.disabled = true;
            saveBtn.textContent = 'Saving…';

            let imagePath = null;

            if (selectedImageFile) {
                const fileName = `${userId}/${Date.now()}.jpg`;
                const { data: uploadData, error: uploadError } = await sb.storage
                    .from('nappy-images')
                    .upload(fileName, selectedImageFile, { contentType: 'image/jpeg' });

                if (uploadError) {
                    showToast('Image upload failed: ' + uploadError.message, 'error');
                    saveBtn.disabled = false;
                    saveBtn.textContent = 'Save change';
                    return;
                }
                imagePath = uploadData.path;
            }

            const entry = {
                user_id: userId,
                nappy_type: nappyType,
                changed_at: new Date(changedAt).toISOString(),
                image_path: imagePath,
                notes: document.getElementById('notes').value.trim() || null,
            };

            const { error } = await sb.from('nappies').insert(entry);
            saveBtn.disabled = false;
            saveBtn.textContent = 'Save change';
            if (error) {
                showToast('Error saving: ' + error.message, 'error');
                return;
            }

            showToast('Nappy logged!');
            resetForm();
            await Promise.all([loadEntries(), loadChart()]);
        }

        function resetForm() {
            selectedImageFile = null;
            document.getElementById('notes').value = '';
            document.getElementById('image-input').value = '';
            document.getElementById('upload-area').classList.remove('has-image');
            document.getElementById('upload-placeholder').style.display = 'block';
            document.getElementById('upload-preview').style.display = 'none';
            document.getElementById('upload-preview').innerHTML = '';
            prefillTime();
        }

        // --- Load entries ---
        async function loadEntries() {
            const userId = await getUserId();
            const { data, error } = await sb
                .from('nappies')
                .select('*')
                .eq('user_id', userId)
                .order('changed_at', { ascending: false })
                .limit(20);

            if (error) console.error('Failed to load nappies:', error.message);

            const container = document.getElementById('entry-list-container');
            recentEntries = data || [];
            renderSummary();

            if (recentEntries.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">${icon('baby', 'icon-2xl')}</div>
                        <div class="empty-state-text">No nappies logged yet</div>
                    </div>`;
                return;
            }

            const entriesWithUrls = await Promise.all(recentEntries.map(async (entry) => {
                if (entry.image_path) {
                    const { data: signedData } = await sb.storage
                        .from('nappy-images')
                        .createSignedUrl(entry.image_path, 3600);
                    entry._image_url = signedData?.signedUrl || null;
                }
                return entry;
            }));

            const todayStart = new Date();
            todayStart.setHours(0, 0, 0, 0);

            container.innerHTML = entriesWithUrls.map(entry => {
                const cat = entry.nappy_type === 'wet' ? 'cat-wet' : entry.nappy_type === 'poo' ? 'cat-dirty' : 'cat-nappy';
                const iconName = entry.nappy_type === 'poo' ? 'circle-outline' : 'droplet';
                const typeLabel = entry.nappy_type === 'both' ? 'Wet + dirty'
                    : entry.nappy_type === 'poo' ? 'Dirty'
                    : 'Wet';
                const when = new Date(entry.changed_at) >= todayStart
                    ? formatTime(entry.changed_at)
                    : `${formatDate(entry.changed_at)} · ${formatTime(entry.changed_at)}`;
                const thumbnail = entry._image_url
                    ? `<img src="${entry._image_url}" class="row-thumb" onclick="openLightbox('${entry._image_url}')" alt="Photo">`
                    : '';

                return `
                    <div class="row">
                        <span class="chip chip-sm ${cat}">${icon(iconName)}</span>
                        <div class="row-body">
                            <div class="row-title">${typeLabel}</div>
                            <div class="row-meta">${entry.notes ? escapeHtml(entry.notes) : '&nbsp;'}</div>
                        </div>
                        ${thumbnail}
                        <span class="row-time">${when}</span>
                        <div class="row-actions">
                            <button class="btn-icon delete" onclick="confirmDelete('${entry.id}', ${entry.image_path ? "'" + entry.image_path + "'" : 'null'})" title="Delete">${icon('trash-2')}</button>
                        </div>
                    </div>`;
            }).join('');
        }

        function renderSummary() {
            const todayStart = new Date();
            todayStart.setHours(0, 0, 0, 0);
            const today = recentEntries.filter(e => new Date(e.changed_at) >= todayStart);
            const wet = today.filter(e => e.nappy_type === 'wet' || e.nappy_type === 'both').length;
            const dirty = today.filter(e => e.nappy_type === 'poo' || e.nappy_type === 'both').length;

            document.getElementById('sum-count').textContent = today.length;
            document.getElementById('sum-split').textContent = today.length ? `${wet} · ${dirty}` : '—';
            document.getElementById('sum-since').textContent = recentEntries.length
                ? formatDuration(Math.max(0, Date.now() - new Date(recentEntries[0].changed_at)))
                : '—';
        }

        // --- Lightbox ---
        function openLightbox(url) {
            document.getElementById('lightbox-img').src = url;
            document.getElementById('lightbox').classList.add('open');
        }

        function closeLightbox() {
            document.getElementById('lightbox').classList.remove('open');
        }

        // --- Delete ---
        function confirmDelete(id, imagePath) {
            deleteId = id;
            deleteImagePath = imagePath;
            document.getElementById('delete-modal').classList.add('open');
            document.body.classList.add('modal-open');
            document.getElementById('confirm-delete-btn').onclick = async () => {
                if (deleteImagePath) {
                    await sb.storage.from('nappy-images').remove([deleteImagePath]);
                }
                const { error } = await sb.from('nappies').delete().eq('id', deleteId);
                if (error) {
                    showToast('Error deleting: ' + error.message, 'error');
                } else {
                    showToast('Entry deleted');
                }
                closeDeleteModal();
                await Promise.all([loadEntries(), loadChart()]);
            };
        }

        function closeDeleteModal() {
            document.getElementById('delete-modal').classList.remove('open');
            document.body.classList.remove('modal-open');
            deleteId = null;
            deleteImagePath = null;
        }

        // --- Chart (last 7 days) ---
        async function loadChart() {
            const userId = await getUserId();
            const todayStart = new Date();
            todayStart.setHours(0, 0, 0, 0);
            const rangeStart = new Date(todayStart.getTime() - 6 * 86400000);

            const { data, error } = await sb
                .from('nappies')
                .select('changed_at')
                .eq('user_id', userId)
                .gte('changed_at', rangeStart.toISOString())
                .order('changed_at', { ascending: true });

            if (error) console.error('Failed to load chart data:', error.message);

            const entries = data || [];
            const days = [];
            for (let i = 6; i >= 0; i--) {
                const d = new Date(todayStart.getTime() - i * 86400000);
                days.push({
                    key: d.toLocaleDateString('en-CA'),
                    label: d.toLocaleDateString('en-AU', { weekday: 'narrow' }),
                });
            }

            const counts = days.map(d =>
                entries.filter(e => new Date(e.changed_at).toLocaleDateString('en-CA') === d.key).length);

            renderBarChart(document.getElementById('nappy-chart'),
                days.map((d, i) => ({ value: counts[i], label: d.label })));

            const total = counts.reduce((a, b) => a + b, 0);
            document.getElementById('chart-avg').textContent = total ? (total / 7).toFixed(1) + ' avg' : '';
        }
    </script>
</body>
</html>
