<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#1B1713">
    <title>Baby Tracker — Overview</title>
    <script src="js/theme.js"></script>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="app-container">
        <header class="appbar" id="appbar"></header>

        <h1 class="screen-title">Overview</h1>

        <!-- Right now -->
        <section class="card cat-feed">
            <div style="display:flex;align-items:center;gap:11px;margin-bottom:14px">
                <span class="chip cat-feed" id="hero-chip"></span>
                <span class="micro-label" id="hero-label">Right now</span>
            </div>
            <div class="hero-value" id="hero-value">—</div>
            <div class="hero-sub" id="hero-sub">no feeds logged yet</div>
            <div class="mini-grid" style="grid-template-columns:1fr 1fr">
                <div>
                    <div class="mini-value" id="mini-awake">—</div>
                    <div class="mini-label" id="mini-awake-label">awake</div>
                </div>
                <div>
                    <div class="mini-value" id="mini-night">—</div>
                    <div class="mini-label">last night</div>
                </div>
            </div>
        </section>

        <!-- Today so far -->
        <section class="card">
            <div class="micro-label" style="margin-bottom:13px">Today so far</div>
            <div class="stat-grid">
                <a href="feeding.html" class="stat-card cat-feed">
                    <span class="chip chip-xs cat-feed" id="stat-feed-chip"></span>
                    <span class="stat-value" id="stat-feed-value">—</span>
                    <span class="stat-meta" id="stat-feed-meta">Feeds</span>
                </a>
                <a href="sleep.html" class="stat-card cat-sleep">
                    <span class="chip chip-xs cat-sleep" id="stat-sleep-chip"></span>
                    <span class="stat-value" id="stat-sleep-value">—</span>
                    <span class="stat-meta" id="stat-sleep-meta">Sleep</span>
                </a>
                <a href="weight.html" class="stat-card cat-weight" style="grid-column:1 / -1">
                    <span class="chip chip-xs cat-weight" id="stat-weight-chip"></span>
                    <span class="stat-value" id="stat-weight-value">—</span>
                    <span class="stat-meta" id="stat-weight-meta">Weight</span>
                </a>
            </div>
        </section>

        <!-- Feeds · last 7 days -->
        <section class="card cat-feed">
            <div class="card-head" style="align-items:baseline;margin-bottom:16px">
                <span class="micro-label">Feeds · last 7 days</span>
                <span class="card-head-note" id="feed-bars-avg"></span>
            </div>
            <div class="bars" id="feed-bars"></div>
        </section>

        <!-- Sleep · last 7 days -->
        <section class="card cat-sleep">
            <div class="card-head" style="align-items:baseline;margin-bottom:16px">
                <span class="micro-label">Sleep · last 7 days</span>
                <span class="card-head-note" id="sleep-bars-avg"></span>
            </div>
            <div class="bars" id="sleep-bars"></div>
        </section>
    </div>

    <!-- Bottom Nav -->
    <nav class="bottom-nav" id="main-nav"></nav>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/icons.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/app-shell.js"></script>
    <script src="js/charts.js"></script>
    <script>
        document.getElementById('hero-chip').innerHTML = icon('milk');
        document.getElementById('stat-feed-chip').innerHTML = icon('milk');
        document.getElementById('stat-sleep-chip').innerHTML = icon('moon');
        document.getElementById('stat-weight-chip').innerHTML = icon('scale');

        let weightUnit = 'kg';
        let raw = { feedings: [], sleeps: [], weights: [] };

        (async () => {
            const session = await requireAuth();
            if (!session) return;
            await initAppShell('dashboard.html');
            weightUnit = _userPrefs.weight_unit || 'kg';
            await loadDashboard();
            // Keep relative times fresh while the screen stays open
            setInterval(renderAll, 30000);
            document.addEventListener('visibilitychange', () => {
                if (!document.hidden) loadDashboard();
            });
            document.addEventListener('bt:prefs-changed', () => loadUserPrefs(true).then(refreshAppBar));
        })();

        function startOfLocalDay(d = new Date()) {
            const x = new Date(d);
            x.setHours(0, 0, 0, 0);
            return x;
        }

        async function loadDashboard() {
            const userId = await getUserId();
            const rangeStart = new Date(startOfLocalDay().getTime() - 6 * 86400000).toISOString();
            const sleepStart = new Date(startOfLocalDay().getTime() - 8 * 86400000).toISOString();

            const [feedings, sleeps, weights] = await Promise.all([
                sb.from('feedings').select('id, session_id, start_time, end_time, feed_type, volume_ml, breast_side')
                    .eq('user_id', userId).gte('start_time', rangeStart).order('start_time', { ascending: true }),
                sb.from('sleeps').select('start_time, end_time')
                    .eq('user_id', userId).gte('start_time', sleepStart).order('start_time', { ascending: true }),
                sb.from('weights').select('weight_kg, measured_at')
                    .eq('user_id', userId).order('measured_at', { ascending: false }).limit(10),
            ]);

            for (const [name, res] of Object.entries({ feedings, sleeps, weights })) {
                if (res.error) console.error(`Failed to load ${name}:`, res.error.message);
            }

            raw = {
                feedings: feedings.data || [],
                sleeps: sleeps.data || [],
                weights: weights.data || [],
            };
            renderAll();
        }

        function renderAll() {
            renderHero();
            renderToday();
            renderCharts();
        }

        // Group feed records into sessions keyed on session_id (fallback: id)
        function feedSessions(entries) {
            const map = new Map();
            entries.forEach(e => {
                const key = e.session_id || e.id;
                if (!map.has(key)) map.set(key, []);
                map.get(key).push(e);
            });
            return Array.from(map.values()).map(recs => {
                const earliest = recs.reduce((a, b) => new Date(a.start_time) < new Date(b.start_time) ? a : b);
                return { time: new Date(earliest.start_time), recs };
            }).sort((a, b) => a.time - b.time);
        }

        function feedKindLabel(recs) {
            const types = new Set(recs.map(r => r.feed_type));
            if (types.has('breast')) return 'Breast';
            if (types.has('bottle')) return 'Bottle';
            if (types.has('solids')) return 'Solids';
            return 'Feed';
        }

        function renderHero() {
            const now = Date.now();
            const sessions = feedSessions(raw.feedings);
            const last = sessions[sessions.length - 1];

            if (last) {
                document.getElementById('hero-value').textContent = formatDuration(Math.max(0, now - last.time.getTime()));
                document.getElementById('hero-sub').textContent =
                    `since last feed · ${feedKindLabel(last.recs)}, ${formatTime(last.time.toISOString())}`;
            } else {
                document.getElementById('hero-value').textContent = '—';
                document.getElementById('hero-sub').textContent = 'no feeds in the last 7 days';
            }

            // awake / asleep
            const open = raw.sleeps.find(s => !s.end_time);
            const completed = raw.sleeps.filter(s => s.end_time);
            const awakeEl = document.getElementById('mini-awake');
            const awakeLabelEl = document.getElementById('mini-awake-label');
            if (open) {
                awakeEl.textContent = formatDuration(now - new Date(open.start_time));
                awakeLabelEl.textContent = 'asleep';
            } else if (completed.length) {
                const lastEnd = completed.reduce((a, b) => new Date(a.end_time) > new Date(b.end_time) ? a : b);
                awakeEl.textContent = formatDuration(now - new Date(lastEnd.end_time));
                awakeLabelEl.textContent = 'awake';
            } else {
                awakeEl.textContent = '—';
                awakeLabelEl.textContent = 'awake';
            }

            // last night: overlap with yesterday 19:00 → today 09:00
            const today = startOfLocalDay();
            const nightStart = new Date(today.getTime() - 5 * 3600000);   // yesterday 19:00
            const nightEnd = new Date(today.getTime() + 9 * 3600000);     // today 09:00
            const nightMs = sumOverlap(raw.sleeps, nightStart, new Date(Math.min(nightEnd, now)));
            document.getElementById('mini-night').textContent = nightMs > 0 ? formatDuration(nightMs) : '—';
        }

        // Total sleep time overlapping [from, to]; open sleeps count up to now.
        function sumOverlap(sleeps, from, to) {
            let total = 0;
            sleeps.forEach(s => {
                const start = new Date(s.start_time);
                const end = s.end_time ? new Date(s.end_time) : new Date();
                const lo = Math.max(start, from);
                const hi = Math.min(end, to);
                if (hi > lo) total += hi - lo;
            });
            return total;
        }

        function renderToday() {
            const todayStart = startOfLocalDay();
            const now = new Date();

            // Feeds
            const sessions = feedSessions(raw.feedings).filter(s => s.time >= todayStart);
            const bottleML = raw.feedings
                .filter(f => f.feed_type === 'bottle' && f.volume_ml && new Date(f.start_time) >= todayStart)
                .reduce((sum, f) => sum + f.volume_ml, 0);
            document.getElementById('stat-feed-value').textContent = sessions.length;
            document.getElementById('stat-feed-meta').textContent =
                bottleML > 0 ? `Feeds · ${bottleML} ml bottle` : 'Feeds';

            // Sleep
            const sleepMs = sumOverlap(raw.sleeps, todayStart, now);
            const sessionsToday = raw.sleeps.filter(s => new Date(s.start_time) >= todayStart).length;
            document.getElementById('stat-sleep-value').textContent = sleepMs > 0 ? formatDuration(sleepMs) : '0m';
            document.getElementById('stat-sleep-meta').textContent =
                `Sleep · ${sessionsToday} session${sessionsToday === 1 ? '' : 's'}`;

            // Weight
            const latest = raw.weights[0];
            if (latest) {
                const display = weightUnit === 'lbs'
                    ? (latest.weight_kg * 2.20462).toFixed(1) + ' lbs'
                    : Number(latest.weight_kg).toFixed(2) + ' kg';
                document.getElementById('stat-weight-value').textContent = display;
                const delta = weeklyDelta(raw.weights);
                document.getElementById('stat-weight-meta').textContent = delta !== null
                    ? `Weight · ${delta >= 0 ? '+' : '−'}${Math.abs(delta)} g / wk`
                    : `Weight · ${formatDate(latest.measured_at)}`;
            } else {
                document.getElementById('stat-weight-value').textContent = '—';
                document.getElementById('stat-weight-meta').textContent = 'Weight';
            }
        }

        // Grams gained per week: latest vs the nearest measurement ≥5 days older.
        function weeklyDelta(weights) {
            if (weights.length < 2) return null;
            const latest = weights[0];
            const t0 = new Date(latest.measured_at);
            const ref = weights.find(w => (t0 - new Date(w.measured_at)) >= 5 * 86400000);
            if (!ref) return null;
            const days = (t0 - new Date(ref.measured_at)) / 86400000;
            return Math.round((latest.weight_kg - ref.weight_kg) * 1000 / days * 7);
        }

        function last7Days() {
            const days = [];
            const today = startOfLocalDay();
            for (let i = 6; i >= 0; i--) {
                const d = new Date(today.getTime() - i * 86400000);
                days.push({
                    key: d.toLocaleDateString('en-CA'),
                    label: d.toLocaleDateString('en-AU', { weekday: 'narrow' }),
                });
            }
            return days;
        }

        function renderCharts() {
            const days = last7Days();

            // Feeds per day (distinct sessions)
            const sessions = feedSessions(raw.feedings);
            const feedCounts = days.map(d =>
                sessions.filter(s => s.time.toLocaleDateString('en-CA') === d.key).length);
            renderBarChart(document.getElementById('feed-bars'),
                days.map((d, i) => ({ value: feedCounts[i], label: d.label })));
            const feedTotal = feedCounts.reduce((a, b) => a + b, 0);
            document.getElementById('feed-bars-avg').textContent =
                feedTotal ? (feedTotal / 7).toFixed(1) + ' avg' : '';

            // Sleep hours per day (completed sleeps, grouped by start date)
            const sleepHours = days.map(d =>
                raw.sleeps.filter(s => s.end_time &&
                        new Date(s.start_time).toLocaleDateString('en-CA') === d.key)
                    .reduce((sum, s) => sum + (new Date(s.end_time) - new Date(s.start_time)) / 3600000, 0));
            renderBarChart(document.getElementById('sleep-bars'),
                days.map((d, i) => ({ value: sleepHours[i], label: d.label })));
            const sleepTotal = sleepHours.reduce((a, b) => a + b, 0);
            document.getElementById('sleep-bars-avg').textContent =
                sleepTotal ? (sleepTotal / 7).toFixed(1) + 'h avg' : '';
        }
    </script>
</body>
</html>
