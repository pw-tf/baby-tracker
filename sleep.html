<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#1B1713">
    <title>Baby Tracker — Sleep</title>
    <script src="js/theme.js"></script>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="app-container">
        <header class="appbar" id="appbar"></header>

        <h1 class="screen-title">Sleep</h1>

        <!-- Status / nap timer -->
        <section class="card cat-sleep">
            <div style="display:flex;align-items:center;justify-content:space-between;gap:12px">
                <div style="min-width:0">
                    <div class="micro-label" style="margin-bottom:7px" id="status-label">Awake</div>
                    <div class="sleep-status-value" id="status-value">—</div>
                    <div class="sleep-status-meta" id="status-meta">no sleep logged yet</div>
                </div>
                <button class="btn" id="status-btn" style="width:auto;flex-shrink:0;background:var(--c-sleep);color:#fff;padding:14px 22px" onclick="statusAction()"><span id="status-btn-icon"></span><span id="status-btn-label">Start nap</span></button>
            </div>
            <!-- shown after stopping, before saving -->
            <div id="save-section" style="display:none;margin-top:16px;padding-top:15px;border-top:1px solid var(--hair)">
                <div class="form-group">
                    <label class="form-label" for="notes">Notes</label>
                    <textarea id="notes" class="form-textarea" placeholder="Optional notes…" rows="2"></textarea>
                </div>
                <div style="display:flex;gap:8px">
                    <button class="btn btn-secondary" style="flex:1" onclick="discardTimer()">Discard</button>
                    <button class="btn btn-primary" style="flex:1" onclick="saveTimerEntry()">Save nap</button>
                </div>
            </div>
            <button class="pill-btn" style="margin-top:14px" onclick="toggleManual()"><span id="manual-icon"></span><span id="manual-label">Log manually…</span></button>
        </section>

        <!-- Manual entry -->
        <section class="card" id="manual-card" style="display:none">
            <div class="micro-label" style="margin-bottom:12px">Manual entry</div>
            <div class="form-group">
                <label class="form-label" for="manual-start">Fell asleep</label>
                <input type="datetime-local" id="manual-start" class="form-input">
            </div>
            <div class="form-group">
                <label class="form-label" for="manual-end">Woke up</label>
                <input type="datetime-local" id="manual-end" class="form-input">
            </div>
            <div id="manual-duration" style="font-size:12.5px;color:var(--soft);font-weight:600;text-align:center;margin-bottom:12px"></div>
            <div class="form-group">
                <label class="form-label" for="manual-notes">Notes</label>
                <textarea id="manual-notes" class="form-textarea" placeholder="Optional notes…" rows="2"></textarea>
            </div>
            <button class="btn btn-primary" onclick="saveManualEntry()">Save sleep</button>
        </section>

        <!-- Summary -->
        <section class="card">
            <div class="triple">
                <div>
                    <div class="triple-value" style="font-size:22px" id="sum-night">—</div>
                    <div class="triple-label">last night</div>
                </div>
                <div>
                    <div class="triple-value" style="font-size:22px" id="sum-24h">—</div>
                    <div class="triple-label">24h total</div>
                </div>
                <div>
                    <div class="triple-value" style="font-size:22px" id="sum-longest">—</div>
                    <div class="triple-label">longest</div>
                </div>
            </div>
        </section>

        <!-- Hours per day -->
        <section class="card cat-sleep">
            <div class="card-head" style="align-items:baseline;margin-bottom:16px">
                <span class="micro-label">Hours per day</span>
                <span class="card-head-note" id="chart-avg"></span>
            </div>
            <div class="bars" style="height:78px" id="sleep-chart"></div>
        </section>

        <!-- Recent sleep -->
        <section class="card cat-sleep">
            <div class="micro-label" style="margin-bottom:6px">Last 24 hours</div>
            <div id="recent-list">
                <div class="loading"><div class="spinner"></div></div>
            </div>
            <div id="earlier-section" style="display:none">
                <div class="micro-label" style="margin:16px 0 6px">Earlier</div>
                <div id="earlier-list"></div>
            </div>
        </section>
    </div>

    <!-- Delete Modal -->
    <div id="delete-modal" class="modal-overlay">
        <div class="card modal-card">
            <p style="margin-bottom:16px;font-weight:600">Delete this sleep entry?</p>
            <div style="display:flex;gap:8px">
                <button class="btn btn-secondary btn-small" onclick="closeDeleteModal()" style="flex:1">Cancel</button>
                <button class="btn btn-danger btn-small" id="confirm-delete-btn" style="flex:1">Delete</button>
            </div>
        </div>
    </div>

    <!-- Bottom Nav -->
    <nav class="bottom-nav" id="main-nav"></nav>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/icons.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/app-shell.js"></script>
    <script src="js/charts.js"></script>
    <script>
        document.getElementById('manual-icon').innerHTML = icon('plus');

        let deleteId = null;
        let timerRunning = false;
        let timerStart = null;
        let timerInterval = null;
        let sleepData = [];

        // Wall-clock timer persistence — survives page changes, app close, phone lock.
        const NAP_START_KEY = 'nap_timer_start';
        const NAP_STOP_KEY = 'nap_timer_stop';

        (async () => {
            const session = await requireAuth();
            if (!session) return;
            await initAppShell('sleep.html');
            prefillManualTimes();
            setupManualDurationCalc();
            await loadData();
            restoreTimer();
            setInterval(() => { if (!timerRunning) renderStatus(); renderSummary(); }, 30000);
        })();

        // --- Status card / nap timer ---
        function statusAction() {
            if (!timerRunning && !localStorage.getItem(NAP_STOP_KEY)) startTimer();
            else if (timerRunning) stopTimer();
        }

        function startTimer() {
            timerStart = new Date();
            localStorage.setItem(NAP_START_KEY, timerStart.getTime().toString());
            localStorage.removeItem(NAP_STOP_KEY);
            beginRunningUI();
        }

        function beginRunningUI() {
            timerRunning = true;
            setStatusButton('Wake up', 'danger');
            document.getElementById('save-section').style.display = 'none';
            document.getElementById('status-label').textContent = 'Asleep';
            document.getElementById('status-meta').textContent = 'fell asleep at ' + formatTime(timerStart.toISOString());

            clearInterval(timerInterval);
            const tick = () => {
                document.getElementById('status-value').textContent = formatElapsed(Date.now() - timerStart.getTime());
            };
            tick();
            timerInterval = setInterval(tick, 1000);
        }

        function stopTimer() {
            timerRunning = false;
            clearInterval(timerInterval);
            localStorage.setItem(NAP_STOP_KEY, Date.now().toString());
            showStoppedUI();
        }

        function showStoppedUI() {
            const stopMs = Number(localStorage.getItem(NAP_STOP_KEY)) || Date.now();
            document.getElementById('status-label').textContent = 'Nap finished';
            document.getElementById('status-value').textContent = formatDuration(stopMs - timerStart.getTime());
            document.getElementById('status-meta').textContent =
                `${formatTime(timerStart.toISOString())} → ${formatTime(new Date(stopMs).toISOString())}`;
            document.getElementById('status-btn').style.display = 'none';
            document.getElementById('save-section').style.display = 'block';
        }

        function restoreTimer() {
            const startMs = Number(localStorage.getItem(NAP_START_KEY));
            if (!startMs) {
                renderStatus();
                return;
            }
            timerStart = new Date(startMs);
            if (localStorage.getItem(NAP_STOP_KEY)) {
                showStoppedUI();
            } else {
                beginRunningUI();
            }
        }

        function setStatusButton(label, kind) {
            const btn = document.getElementById('status-btn');
            btn.style.display = 'inline-flex';
            if (kind === 'danger') {
                btn.style.background = 'color-mix(in srgb, var(--c-danger) 14%, transparent)';
                btn.style.border = '1px solid color-mix(in srgb, var(--c-danger) 40%, transparent)';
                btn.style.color = 'var(--c-danger)';
                document.getElementById('status-btn-icon').innerHTML = '';
            } else {
                btn.style.background = 'var(--c-sleep)';
                btn.style.border = 'none';
                btn.style.color = '#fff';
                document.getElementById('status-btn-icon').innerHTML = icon('circle-play');
            }
            document.getElementById('status-btn-label').textContent = label;
        }

        // Idle state — time awake since the last completed sleep
        function renderStatus() {
            if (timerRunning || localStorage.getItem(NAP_STOP_KEY)) return;
            setStatusButton('Start nap', 'primary');
            document.getElementById('save-section').style.display = 'none';
            document.getElementById('status-label').textContent = 'Awake';

            const completed = sleepData.filter(s => s.end_time);
            if (completed.length) {
                const lastEnd = completed.reduce((a, b) => new Date(a.end_time) > new Date(b.end_time) ? a : b);
                document.getElementById('status-value').textContent =
                    formatDuration(Date.now() - new Date(lastEnd.end_time));
                document.getElementById('status-meta').textContent =
                    'last nap ended ' + formatTime(lastEnd.end_time);
            } else {
                document.getElementById('status-value').textContent = '—';
                document.getElementById('status-meta').textContent = 'no sleep logged yet';
            }
        }

        function formatElapsed(ms) {
            const totalSec = Math.floor(ms / 1000);
            const hrs = Math.floor(totalSec / 3600);
            const mins = Math.floor((totalSec % 3600) / 60);
            const secs = totalSec % 60;
            return `${String(hrs).padStart(2, '0')}:${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
        }

        async function saveTimerEntry() {
            if (!timerStart) return;
            const userId = await getUserId();

            const stopMs = Number(localStorage.getItem(NAP_STOP_KEY));
            const entry = {
                user_id: userId,
                start_time: timerStart.toISOString(),
                end_time: new Date(stopMs || Date.now()).toISOString(),
                notes: document.getElementById('notes').value.trim() || null,
            };

            const { error } = await sb.from('sleeps').insert(entry);
            if (error) {
                showToast('Error saving: ' + error.message, 'error');
                return;
            }

            showToast('Sleep logged!');
            resetTimerState();
            await loadData();
            renderStatus();
        }

        function discardTimer() {
            resetTimerState();
            renderStatus();
        }

        function resetTimerState() {
            timerStart = null;
            clearInterval(timerInterval);
            timerRunning = false;
            localStorage.removeItem(NAP_START_KEY);
            localStorage.removeItem(NAP_STOP_KEY);
            document.getElementById('notes').value = '';
            document.getElementById('save-section').style.display = 'none';
        }

        // --- Manual entry ---
        function toggleManual() {
            const card = document.getElementById('manual-card');
            const open = card.style.display !== 'none';
            card.style.display = open ? 'none' : 'block';
            document.getElementById('manual-icon').innerHTML = icon(open ? 'plus' : 'minus');
            document.getElementById('manual-label').textContent = open ? 'Log manually…' : 'Hide manual entry';
            if (!open) prefillManualTimes();
        }

        async function saveManualEntry() {
            const userId = await getUserId();
            const startVal = document.getElementById('manual-start').value;
            const endVal = document.getElementById('manual-end').value;

            if (!startVal) {
                showToast('Please set a start time.', 'error');
                return;
            }

            const entry = {
                user_id: userId,
                start_time: new Date(startVal).toISOString(),
                end_time: endVal ? new Date(endVal).toISOString() : null,
                notes: document.getElementById('manual-notes').value.trim() || null,
            };

            const { error } = await sb.from('sleeps').insert(entry);
            if (error) {
                showToast('Error saving: ' + error.message, 'error');
                return;
            }

            showToast('Sleep logged!');
            document.getElementById('manual-notes').value = '';
            prefillManualTimes();
            await loadData();
            renderStatus();
        }

        function prefillManualTimes() {
            document.getElementById('manual-start').value = toDatetimeLocal(new Date());
            document.getElementById('manual-end').value = '';
        }

        function setupManualDurationCalc() {
            const startInput = document.getElementById('manual-start');
            const endInput = document.getElementById('manual-end');
            const durationEl = document.getElementById('manual-duration');

            function calc() {
                if (startInput.value && endInput.value) {
                    const ms = new Date(endInput.value) - new Date(startInput.value);
                    durationEl.textContent = ms > 0 ? `Duration: ${formatDuration(ms)}` : 'End must be after start';
                } else {
                    durationEl.textContent = '';
                }
            }
            startInput.addEventListener('change', calc);
            endInput.addEventListener('change', calc);
        }

        // --- Data ---
        async function loadData() {
            const userId = await getUserId();
            const rangeStart = new Date();
            rangeStart.setHours(0, 0, 0, 0);
            rangeStart.setDate(rangeStart.getDate() - 8);

            const { data, error } = await sb
                .from('sleeps')
                .select('*')
                .eq('user_id', userId)
                .gte('start_time', rangeStart.toISOString())
                .order('start_time', { ascending: false });

            if (error) {
                console.error('Failed to load sleeps:', error.message);
                showToast('Error loading sleep: ' + error.message, 'error');
            }

            sleepData = data || [];
            renderSummary();
            renderChart();
            renderLists();
        }

        function sumOverlap(from, to) {
            let total = 0;
            sleepData.forEach(s => {
                const start = new Date(s.start_time);
                const end = s.end_time ? new Date(s.end_time) : new Date();
                const lo = Math.max(start, from);
                const hi = Math.min(end, to);
                if (hi > lo) total += hi - lo;
            });
            return total;
        }

        function renderSummary() {
            const now = new Date();
            const todayStart = new Date(now);
            todayStart.setHours(0, 0, 0, 0);

            // last night: yesterday 19:00 → today 09:00 (clipped to now)
            const nightStart = new Date(todayStart.getTime() - 5 * 3600000);
            const nightEnd = new Date(Math.min(todayStart.getTime() + 9 * 3600000, now.getTime()));
            const nightMs = sumOverlap(nightStart, nightEnd);
            document.getElementById('sum-night').textContent = nightMs > 0 ? formatDuration(nightMs) : '—';

            // 24h total
            const dayMs = sumOverlap(new Date(now.getTime() - 24 * 3600000), now);
            document.getElementById('sum-24h').textContent = dayMs > 0 ? formatDuration(dayMs) : '—';

            // longest stretch in the last 24h (clipped to the window)
            const from = new Date(now.getTime() - 24 * 3600000);
            let longest = 0;
            sleepData.forEach(s => {
                const start = new Date(s.start_time);
                const end = s.end_time ? new Date(s.end_time) : now;
                const lo = Math.max(start, from);
                const hi = Math.min(end, now);
                if (hi > lo) longest = Math.max(longest, hi - lo);
            });
            document.getElementById('sum-longest').textContent = longest > 0 ? formatDuration(longest) : '—';
        }

        function renderChart() {
            const todayStart = new Date();
            todayStart.setHours(0, 0, 0, 0);

            const days = [];
            for (let i = 6; i >= 0; i--) {
                const d = new Date(todayStart.getTime() - i * 86400000);
                days.push({
                    key: d.toLocaleDateString('en-CA'),
                    label: d.toLocaleDateString('en-AU', { weekday: 'narrow' }),
                });
            }

            const hours = days.map(d =>
                sleepData.filter(s => s.end_time &&
                        new Date(s.start_time).toLocaleDateString('en-CA') === d.key)
                    .reduce((sum, s) => sum + (new Date(s.end_time) - new Date(s.start_time)) / 3600000, 0));

            renderBarChart(document.getElementById('sleep-chart'),
                days.map((d, i) => ({ value: hours[i], label: d.label })));

            const total = hours.reduce((a, b) => a + b, 0);
            document.getElementById('chart-avg').textContent = total ? (total / 7).toFixed(1) + 'h avg' : '';
        }

        function sleepTag(entry) {
            const ms = entry.end_time ? durationBetween(entry.start_time, entry.end_time) : null;
            if (!entry.end_time) return 'Sleeping';
            if (ms < 45 * 60000) return 'Catnap';
            const h = new Date(entry.start_time).getHours();
            if (h >= 19 || h < 6) return 'Night';
            if (h < 11) return 'Morning';
            if (h < 16) return 'Midday';
            return 'Evening';
        }

        function renderRow(entry) {
            const duration = entry.end_time
                ? formatDuration(durationBetween(entry.start_time, entry.end_time))
                : 'In progress…';
            const endLabel = entry.end_time ? ` → ${formatTime(entry.end_time)}` : '';
            const notes = entry.notes ? ` · ${escapeHtml(entry.notes)}` : '';

            return `
                <div class="row">
                    <span class="chip chip-sm cat-sleep">${icon('moon')}</span>
                    <div class="row-body">
                        <div class="row-title">${duration}</div>
                        <div class="row-meta">${formatTime(entry.start_time)}${endLabel}${notes}</div>
                    </div>
                    <span class="row-tag">${sleepTag(entry)}</span>
                    <div class="row-actions">
                        <button class="btn-icon delete" onclick="confirmDelete('${entry.id}')" title="Delete">${icon('trash-2')}</button>
                    </div>
                </div>`;
        }

        function renderLists() {
            const container = document.getElementById('recent-list');
            const earlierSection = document.getElementById('earlier-section');
            const earlierList = document.getElementById('earlier-list');

            if (sleepData.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">${icon('moon', 'icon-2xl')}</div>
                        <div class="empty-state-text">No sleep logged yet</div>
                    </div>`;
                earlierSection.style.display = 'none';
                return;
            }

            const cutoff = Date.now() - 24 * 3600000;
            const recent = sleepData.filter(s => new Date(s.start_time) >= cutoff);
            const earlier = sleepData.filter(s => new Date(s.start_time) < cutoff).slice(0, 12);

            container.innerHTML = recent.length
                ? recent.map(renderRow).join('')
                : `<div class="empty-state" style="padding:14px"><div class="empty-state-text">Nothing in the last 24 hours</div></div>`;

            if (earlier.length) {
                earlierSection.style.display = 'block';
                earlierList.innerHTML = earlier.map(renderRow).join('');
            } else {
                earlierSection.style.display = 'none';
            }
        }

        // --- Delete ---
        function confirmDelete(id) {
            deleteId = id;
            document.getElementById('delete-modal').classList.add('open');
            document.body.classList.add('modal-open');
            document.getElementById('confirm-delete-btn').onclick = async () => {
                const { error } = await sb.from('sleeps').delete().eq('id', deleteId);
                if (error) {
                    showToast('Error deleting: ' + error.message, 'error');
                } else {
                    showToast('Entry deleted');
                }
                closeDeleteModal();
                await loadData();
                renderStatus();
            };
        }

        function closeDeleteModal() {
            document.getElementById('delete-modal').classList.remove('open');
            document.body.classList.remove('modal-open');
            deleteId = null;
        }
    </script>
</body>
</html>
